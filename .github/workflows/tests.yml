name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test_ord_interface:
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-14"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      PGDATA: $GITHUB_WORKSPACE/rdkit-postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniconda-version: 'latest'
      - name: Setup PostgreSQL
        shell: bash -l {0}
        run: |
          # NOTE(skearnes): conda is only used for postgres (not python).
          conda install -c conda-forge rdkit-postgresql
          initdb
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: actions-setup-redis
        uses: shogo82148/actions-setup-redis@59cda539fd5cc9be4c42bb07e4b28156951f37d6 # v1.55.0
      - name: Install ord_interface
        run: uv sync --frozen
      - name: Run tests
        shell: bash -l {0}
        run: |
          uv run coverage erase
          uv run pytest -vv --cov=ord_interface --durations=20
          uv run coverage report

  test_app:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    # NOTE(skearnes): Docker is not supported on macOS GitLab runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: actions-setup-redis
        uses: shogo82148/actions-setup-redis@59cda539fd5cc9be4c42bb07e4b28156951f37d6 # v1.55.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install ord-interface
        run: uv sync --frozen
      - name: Run tests
        run: |
          cd "${GITHUB_WORKSPACE}/ord_interface"
          uv run ./run_tests.sh
